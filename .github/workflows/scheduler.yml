name: SinhalaStoryBot Auto Run

on:

  schedule:

    # Runs 5 times daily
    - cron: "0 1 * * *"
    - cron: "0 4 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"


  workflow_dispatch:


jobs:

  create-videos:

    runs-on: ubuntu-latest


    steps:

    - name: Download Repository
      uses: actions/checkout@v4



    - name: Setup Python
      uses: actions/setup-python@v5

      with:

        python-version: "3.12"



    - name: Install Libraries

      run:

        pip install -r requirements.txt



    - name: Run SinhalaStoryBot

      run:

        python run.py



    - name: Save Videos

      uses: actions/upload-artifact@v4

      with:

        name: generated-videos

        path: output/videos/

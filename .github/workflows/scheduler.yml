name: SinhalaStoryBot Auto Run

on:

  workflow_dispatch:

  schedule:
    # GitHub uses UTC time
    # 5 videos per day
    - cron: "30 1 * * *"
    - cron: "30 4 * * *"
    - cron: "30 7 * * *"
    - cron: "30 10 * * *"
    - cron: "30 13 * * *"


jobs:

  create-videos:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.12"



    - name: Install FFmpeg
      run: |
        sudo apt update
        sudo apt install -y ffmpeg



    - name: Install Sinhala Fonts
      run: |
        sudo apt install -y fonts-noto-core fonts-noto-extra



    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt



    - name: Create Folders
      run: |
        mkdir -p output/videos
        mkdir -p output/images
        mkdir -p output/audio
        mkdir -p output/temp
        mkdir -p logs
        mkdir -p database



    - name: Run Sinhala Story Bot
      env:

        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      run: |
        python run.py



    - name: Check Generated Files
      if: always()

      run: |
        echo "====== OUTPUT ======"
        ls -R output
        echo "===================="



    - name: Upload Videos
      if: always()

      uses: actions/upload-artifact@v4

      with:

        name: sinhala-story-videos

        path: output/

        retention-days: 7
